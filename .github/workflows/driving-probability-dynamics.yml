name: dynamic System One probability experiment

on:
  push:
    branches:
      - research/driving-probability-dynamics
    paths:
      - ".github/workflows/driving-probability-dynamics.yml"
      - "experiments/driving_probability/**"
  workflow_dispatch:

concurrency:
  group: driving-probability-dynamics
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metric-test dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run metric tests
        working-directory: experiments/driving_probability
        run: python -m unittest -v test_metrics.py

  jev:
    needs: test
    environment: typesafe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYPESAFE_API_KEY: "${{ secrets.TYPESAFE_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run Jev probability dynamics experiment
        run: |
          python experiments/driving_probability/run_experiment.py \
            --backend jev \
            --output results/driving_probability/jev.json
      - uses: actions/upload-artifact@v4
        with:
          name: driving-probability-jev
          path: results/driving_probability/jev.json
          if-no-files-found: error

  dashscope:
    needs: test
    environment: dashscope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHSCOPE_API_KEY: "${{ secrets.DASHSCOPE_API_KEY }}"
      DASHSCOPE_SYSTEMONE_URL: "https://llm-cnwlvwjfb3z4aa29.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/systemone"
      DASHSCOPE_MODEL: "decision-model-preview"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run DashScope probability dynamics experiment
        run: |
          python experiments/driving_probability/run_experiment.py \
            --backend dashscope \
            --output results/driving_probability/dashscope.json
      - uses: actions/upload-artifact@v4
        with:
          name: driving-probability-dashscope
          path: results/driving_probability/dashscope.json
          if-no-files-found: error

  report:
    needs: [jev, dashscope]
    if: ${{ always() && needs.jev.result == 'success' && needs.dashscope.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: driving-probability-jev
          path: results/driving_probability
      - uses: actions/download-artifact@v4
        with:
          name: driving-probability-dashscope
          path: results/driving_probability
      - name: Generate research report
        run: |
          python experiments/driving_probability/report.py \
            --jev results/driving_probability/jev.json \
            --dashscope results/driving_probability/dashscope.json \
            --output results/driving_probability/REPORT.md
          cat results/driving_probability/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: driving-probability-research
          path: results/driving_probability
          if-no-files-found: error
