name: Jev vs DashScope typed-decisions 100

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jev-vs-dashscope-typed100.yml"

concurrency:
  group: jev-vs-dashscope-typed100
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dataset dependency
        run: python -m pip install "datasets>=4.8,<5"
      - name: Freeze 100-case stratified sample
        run: |
          python experiments/typed_decisions/prepare_remote_100.py \
            --per-workflow 25 \
            --output results/typed100/cases.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: typed100-cases
          path: results/typed100/cases.jsonl
          if-no-files-found: error

  jev:
    needs: prepare
    environment: typesafe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYPESAFE_API_KEY: "${{ secrets.TYPESAFE_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: typed100-cases
          path: results/typed100
      - name: Install benchmark dependencies
        run: python -m pip install "httpx>=0.27,<1" "numpy>=2,<3"
      - name: Run TypeSafe Jev
        run: |
          python experiments/typed_decisions/run_remote.py \
            --backend jev \
            --cases results/typed100/cases.jsonl \
            --output results/typed100/jev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed100-jev
          path: results/typed100/jev
          if-no-files-found: error

  dashscope:
    needs: prepare
    environment: dashscope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHSCOPE_API_KEY: "${{ secrets.DASHSCOPE_API_KEY }}"
      DASHSCOPE_SYSTEMONE_URL: "https://llm-cnwlvwjfb3z4aa29.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/systemone"
      DASHSCOPE_MODEL: "decision-model-preview"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: typed100-cases
          path: results/typed100
      - name: Install benchmark dependencies
        run: python -m pip install "httpx>=0.27,<1" "numpy>=2,<3"
      - name: Run DashScope decision model
        run: |
          python experiments/typed_decisions/run_remote.py \
            --backend dashscope \
            --cases results/typed100/cases.jsonl \
            --output results/typed100/dashscope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed100-dashscope
          path: results/typed100/dashscope
          if-no-files-found: error

  report:
    needs: [jev, dashscope]
    if: ${{ always() && needs.jev.result == 'success' && needs.dashscope.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: typed100-jev
          path: results/typed100/jev
      - uses: actions/download-artifact@v4
        with:
          name: typed100-dashscope
          path: results/typed100/dashscope
      - name: Generate paired report
        run: |
          python experiments/typed_decisions/report_remote_100.py \
            --jev-summary results/typed100/jev/summary.json \
            --dashscope-summary results/typed100/dashscope/summary.json \
            --jev-decisions results/typed100/jev/decisions.jsonl \
            --dashscope-decisions results/typed100/dashscope/decisions.jsonl \
            --output results/typed100/REPORT.md
          cat results/typed100/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: jev-vs-dashscope-typed100
          path: results/typed100
          if-no-files-found: error
