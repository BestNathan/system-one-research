name: laya smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system-one-benchmark.yml"
      - "experiments/system_one/**"

jobs:
  laya-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      USE_TF: "0"
      USE_TORCH: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Laya
        run: |
          python -m pip install --upgrade pip
          python -m pip install "laya==0.3.21" numpy psutil
          python -c "import laya; print('laya import ok')"
      - name: Run Laya smoke flow
        run: python experiments/system_one/run.py --backend laya --suite smoke --output results/laya
      - name: Show result
        if: always()
        run: |
          test -f results/laya/summary.json && cat results/laya/summary.json || true
          test -f results/laya/raw.jsonl && cat results/laya/raw.jsonl || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laya-smoke
          path: results/laya
          if-no-files-found: warn
