name: two-minute probability worlds

on:
  workflow_dispatch:
    inputs:
      worldlines:
        description: "Worldlines per provider"
        required: true
        default: "100"
      duration_seconds:
        description: "Simulation duration in seconds"
        required: true
        default: "120"
      physics_fps:
        description: "Physics/render frames per second"
        required: true
        default: "12"
      workers:
        description: "Concurrent worldlines per provider"
        required: true
        default: "8"

permissions:
  contents: read

concurrency:
  group: two-minute-probability-worlds
  cancel-in-progress: true

env:
  WORLDLINES: "${{ github.event_name == 'workflow_dispatch' && inputs.worldlines || '100' }}"
  DURATION_SECONDS: "${{ github.event_name == 'workflow_dispatch' && inputs.duration_seconds || '120' }}"
  PHYSICS_FPS: "${{ github.event_name == 'workflow_dispatch' && inputs.physics_fps || '12' }}"
  WORKERS: "${{ github.event_name == 'workflow_dispatch' && inputs.workers || '8' }}"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Compile experiment and check browser JS
        run: |
          python -m py_compile \
            experiments/driving_probability/run_two_minute_world.py \
            scripts/build_two_minute_pages_data.py
          node --check site/experiments/probability-world/app.js
      - name: Run tests
        working-directory: experiments/driving_probability
        run: |
          python -m unittest -v \
            test_metrics.py \
            test_monte_carlo.py \
            test_probabilistic_world.py \
            test_two_minute_world.py

  jev:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test
    environment: typesafe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TYPESAFE_API_KEY: "${{ secrets.TYPESAFE_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.27,<1"
      - name: Run Jev two-minute worlds
        run: |
          python experiments/driving_probability/run_two_minute_world.py \
            --backend jev \
            --worldlines "$WORLDLINES" \
            --duration-seconds "$DURATION_SECONDS" \
            --physics-fps "$PHYSICS_FPS" \
            --workers "$WORKERS" \
            --output results/two_minute/jev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-minute-world-jev
          path: results/two_minute/jev
          if-no-files-found: warn

  dashscope:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test
    environment: dashscope
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DASHSCOPE_API_KEY: "${{ secrets.DASHSCOPE_API_KEY }}"
      DASHSCOPE_SYSTEMONE_URL: "https://llm-cnwlvwjfb3z4aa29.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/systemone"
      DASHSCOPE_MODEL: "decision-model-preview"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.27,<1"
      - name: Run DashScope two-minute worlds
        run: |
          python experiments/driving_probability/run_two_minute_world.py \
            --backend dashscope \
            --worldlines "$WORLDLINES" \
            --duration-seconds "$DURATION_SECONDS" \
            --physics-fps "$PHYSICS_FPS" \
            --workers "$WORKERS" \
            --output results/two_minute/dashscope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-minute-world-dashscope
          path: results/two_minute/dashscope
          if-no-files-found: warn

