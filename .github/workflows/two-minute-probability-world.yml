name: probability world iteration

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Short label for this saved probability world"
        required: false
        default: ""
      note:
        description: "What changed in this iteration?"
        required: false
        default: ""
      duration_seconds:
        description: "Simulation duration in seconds"
        required: true
        default: "120"
      physics_fps:
        description: "Physics/render frames per second"
        required: true
        default: "12"
      seed:
        description: "Matched random seed; keep fixed for controlled iteration"
        required: true
        default: "20260930"

permissions:
  contents: write

concurrency:
  group: two-minute-probability-worlds
  cancel-in-progress: false

env:
  DURATION_SECONDS: "${{ inputs.duration_seconds }}"
  PHYSICS_FPS: "${{ inputs.physics_fps }}"
  SEED: "${{ inputs.seed }}"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Compile experiment and check browser JS
        run: |
          python -m py_compile \
            experiments/driving_probability/run_two_minute_world.py \
            scripts/build_two_minute_pages_data.py \
            scripts/register_probability_world_record.py
          node --check site/experiments/probability-world/app.js
      - name: Run tests
        working-directory: experiments/driving_probability
        run: |
          python -m unittest -v \
            test_metrics.py \
            test_monte_carlo.py \
            test_probabilistic_world.py \
            test_two_minute_world.py

  jev:
    needs: test
    environment: typesafe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TYPESAFE_API_KEY: "${{ secrets.TYPESAFE_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.27,<1"
      - name: Run one Jev probability world
        run: |
          python experiments/driving_probability/run_two_minute_world.py \
            --backend jev \
            --worldlines 1 \
            --duration-seconds "$DURATION_SECONDS" \
            --physics-fps "$PHYSICS_FPS" \
            --workers 1 \
            --seed-base "$SEED" \
            --output results/two_minute/jev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-minute-world-jev
          path: results/two_minute/jev
          if-no-files-found: warn

  dashscope:
    needs: test
    environment: dashscope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DASHSCOPE_API_KEY: "${{ secrets.DASHSCOPE_API_KEY }}"
      DASHSCOPE_SYSTEMONE_URL: "https://llm-cnwlvwjfb3z4aa29.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/systemone"
      DASHSCOPE_MODEL: "decision-model-preview"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.27,<1"
      - name: Run one DashScope probability world
        run: |
          python experiments/driving_probability/run_two_minute_world.py \
            --backend dashscope \
            --worldlines 1 \
            --duration-seconds "$DURATION_SECONDS" \
            --physics-fps "$PHYSICS_FPS" \
            --workers 1 \
            --seed-base "$SEED" \
            --output results/two_minute/dashscope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-minute-world-dashscope
          path: results/two_minute/dashscope
          if-no-files-found: warn

  save-record:
    needs: [jev, dashscope]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: two-minute-world-jev
          path: _artifacts/jev

      - uses: actions/download-artifact@v4
        with:
          name: two-minute-world-dashscope
          path: _artifacts/dashscope

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build persistent replay record
        env:
          RECORD_LABEL: "${{ inputs.label }}"
          RECORD_NOTE: "${{ inputs.note }}"
        run: |
          RECORD_ID="$GITHUB_RUN_ID"
          RECORD_DIR="site/experiments/probability-world/runs/$RECORD_ID"
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          python scripts/build_two_minute_pages_data.py \
            --jev-summary _artifacts/jev/summary.json \
            --dashscope-summary _artifacts/dashscope/summary.json \
            --jev-worldlines _artifacts/jev/worldlines.jsonl \
            --dashscope-worldlines _artifacts/dashscope/worldlines.jsonl \
            --run-id "$GITHUB_RUN_ID" \
            --record-id "$RECORD_ID" \
            --created-at "$CREATED_AT" \
            --commit-sha "$GITHUB_SHA" \
            --label "$RECORD_LABEL" \
            --note "$RECORD_NOTE" \
            --seed "$SEED" \
            --output "$RECORD_DIR/record.json" \
            --max-worldlines 1

          python scripts/register_probability_world_record.py \
            --record "$RECORD_DIR/record.json" \
            --manifest site/experiments/probability-world/runs/manifest.json

          test -s "$RECORD_DIR/record.json"
          cat site/experiments/probability-world/runs/manifest.json

      - name: Commit saved probability world
        run: |
          git config user.name "system-one-research bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/experiments/probability-world/runs/
          git commit -m "research: save probability world run $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
