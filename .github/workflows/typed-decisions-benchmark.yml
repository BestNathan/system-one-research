name: typed-decisions full benchmark

on:
  workflow_dispatch:

concurrency:
  group: typed-decisions-full
  cancel-in-progress: true

env:
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"
  HF_HOME: "${{ github.workspace }}/.cache/huggingface"
  HUGGINGFACE_HUB_CACHE: "${{ github.workspace }}/.cache/huggingface/hub"

jobs:
  base-laya:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore Hugging Face / Laya cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: typed-decisions-hf-${{ runner.os }}-v2
          restore-keys: |
            typed-decisions-hf-${{ runner.os }}-
      - name: Install CPU experiment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --prefer-binary -r requirements.txt
      - name: Run base Laya
        run: |
          python experiments/typed_decisions/run_laya_batched.py \
            --model convaiinnovations/laya \
            --output results/typed_decisions/base_laya
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-decisions-base-laya
          path: results/typed_decisions/base_laya
          if-no-files-found: error

  typed-laya:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore Hugging Face / Laya cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: typed-decisions-hf-${{ runner.os }}-v2
          restore-keys: |
            typed-decisions-hf-${{ runner.os }}-
      - name: Install CPU experiment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --prefer-binary -r requirements.txt
      - name: Run Laya typed specialist
        run: |
          python experiments/typed_decisions/run_laya_batched.py \
            --model convaiinnovations/laya-typed-decisions \
            --output results/typed_decisions/laya_typed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-decisions-laya-typed
          path: results/typed_decisions/laya_typed
          if-no-files-found: error

  jev:
    environment: typesafe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TYPESAFE_API_KEY: "${{ secrets.TYPESAFE_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Jev experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --prefer-binary -r requirements.txt
      - name: Run TypeSafe Jev
        run: |
          test -n "$TYPESAFE_API_KEY" || { echo "TYPESAFE_API_KEY is not available from the typesafe environment"; exit 2; }
          python experiments/typed_decisions/run_jev.py \
            --model jev-1.13.0 \
            --output results/typed_decisions/jev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-decisions-jev
          path: results/typed_decisions/jev
          if-no-files-found: error

  report:
    needs: [base-laya, typed-laya, jev]
    if: ${{ always() && needs.base-laya.result == 'success' && needs.typed-laya.result == 'success' && needs.jev.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download base Laya results
        uses: actions/download-artifact@v4
        with:
          name: typed-decisions-base-laya
          path: results/typed_decisions/base_laya

      - name: Download typed Laya results
        uses: actions/download-artifact@v4
        with:
          name: typed-decisions-laya-typed
          path: results/typed_decisions/laya_typed

      - name: Download Jev results
        uses: actions/download-artifact@v4
        with:
          name: typed-decisions-jev
          path: results/typed_decisions/jev

      - name: Generate paired research report
        run: |
          python experiments/typed_decisions/report.py \
            --base-summary results/typed_decisions/base_laya/summary.json \
            --typed-summary results/typed_decisions/laya_typed/summary.json \
            --jev-summary results/typed_decisions/jev/summary.json \
            --base-decisions results/typed_decisions/base_laya/decisions.jsonl \
            --typed-decisions results/typed_decisions/laya_typed/decisions.jsonl \
            --jev-decisions results/typed_decisions/jev/decisions.jsonl \
            --output results/typed_decisions/REPORT.md
          cat results/typed_decisions/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: typed-decisions-research
          path: results/typed_decisions
          if-no-files-found: error
