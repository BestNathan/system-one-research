name: deploy system one research pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_two_minute_pages_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      probability_world_run_id:
        description: "Workflow run containing two-minute probability-world artifacts"
        required: true
        default: "36682237914"
  workflow_run:
    workflows:
      - "two-minute probability worlds"
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: system-one-research-pages
  cancel-in-progress: true

env:
  PROBABILITY_WORLD_RUN_ID: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event_name == 'workflow_dispatch' && inputs.probability_world_run_id || '36682237914' }}"

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Jev probability-world artifacts
        uses: actions/download-artifact@v4
        with:
          name: two-minute-world-jev
          path: _artifacts/probability-world/jev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PROBABILITY_WORLD_RUN_ID }}

      - name: Download DashScope probability-world artifacts
        uses: actions/download-artifact@v4
        with:
          name: two-minute-world-dashscope
          path: _artifacts/probability-world/dashscope
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PROBABILITY_WORLD_RUN_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build probability-world route data
        run: |
          python scripts/build_two_minute_pages_data.py \
            --jev-summary _artifacts/probability-world/jev/summary.json \
            --dashscope-summary _artifacts/probability-world/dashscope/summary.json \
            --jev-worldlines _artifacts/probability-world/jev/worldlines.jsonl \
            --dashscope-worldlines _artifacts/probability-world/dashscope/worldlines.jsonl \
            --run-id "$PROBABILITY_WORLD_RUN_ID" \
            --output site/experiments/probability-world/data/probability-world.json \
            --max-worldlines 24
          test -s site/experiments/probability-world/data/probability-world.json
          du -h site/experiments/probability-world/data/probability-world.json

      - name: Check static routes
        run: |
          test -s site/index.html
          test -s site/experiments/index.html
          test -s site/experiments/manifest.json
          test -s site/experiments/probability-world/index.html
          node --check site/catalog.js
          node --check site/experiments/probability-world/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy research site
        id: deployment
        uses: actions/deploy-pages@v4
